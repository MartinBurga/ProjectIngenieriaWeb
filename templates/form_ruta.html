{% extends "base.html" %}
{% block title %}{{ 'Editar' if edit_mode else 'Registrar' }} Ruta{% endblock %}

{% block content %}
<h1>{{ 'Editar Ruta' if edit_mode else 'Registro de Ruta' }}</h1>

<form action="{{ url_for('rutas.editar_ruta', id=ruta.idRuta) if edit_mode else url_for('rutas.registrar_ruta') }}"
    method="post">

    <label>ID:</label><br>
    <input type="text" name="id" value="{{ ruta.idRuta if edit_mode else total_rutas + 1 }}" readonly><br><br>

    <label>Nombre de Ruta:</label><br>
    <input type="text" name="nombre_ruta" value="{{ ruta.nombreRuta if edit_mode else '' }}" required><br><br>

    <div>
        <div class="form-group">
            <label>Origen</label>
            <input type="text" name="origen" value="{{ ruta.origen if edit_mode else '' }}" required
                placeholder="Ej: Terminal Quitumbe, Quito">
        </div>

        <div class="form-group">
            <label>Destino</label>
            <input type="text" name="destino" value="{{ ruta.destino if edit_mode else '' }}" required
                placeholder="Ej: Terminal Carcelén, Quito">
        </div>
    </div><br>

    <div">
        <div>
            <label>Precio Pasaje ($):</label>
            <input type="number" step="0.01" name="precio_pasaje" value="{{ ruta.precio_pasaje if edit_mode else '' }}"
                required style="width: 100%;">
        </div>
    </div><br>

    <button type="submit">{{ 'Actualizar' if edit_mode else 'Guardar' }} Ruta</button>
    <a href="/">Cancelar</a>
</form>
{% endblock %}
